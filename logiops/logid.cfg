devices: ({
    name: "MX Master 3S";
    buttons: ({
        cid: 0xc3;
        action: {
            type: "Gestures";
            gestures: (
                {
                    direction: "Left";
                    mode: "OnInterval";
                    // OnInterval fires after threshold + interval, then every interval.
                    threshold: 1;
                    interval: 800;
                    action: {
                        type: "Keypress";
                        keys: ["KEY_F13"];
                    };
                },
                {
                    direction: "Right";
                    mode: "OnInterval";
                    threshold: 1;
                    interval: 800;
                    action: {
                        type: "Keypress";
                        keys: ["KEY_F14"];
                    };
                },
                { direction: "Up"; mode: "NoPress"; },
                { direction: "Down"; mode: "NoPress"; },
                { direction: "None"; mode: "NoPress"; }
            );
        };
    });
});
