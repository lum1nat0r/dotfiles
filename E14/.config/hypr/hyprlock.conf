general {
    hide_cursor = false
    immediate_render = true
}

auth {
    pam:enabled = true
    fingerprint:enabled = true
    fingerprint:ready_message = Finger auflegen
    fingerprint:present_message = Finger wird gescannt
}

background {
    monitor =
    color = rgb(10151f)
}

# Uhrzeit
label {
    monitor =
    text = $TIME
    color = rgb(ffffff)
    font_size = 80
    position = 0, 130
    halign = center
    valign = center
}

# Passwortfeld
input-field {
    monitor =
    size = 360, 60
    outline_thickness = 2
    outer_color = rgb(89b4fa)
    inner_color = rgb(252935)
    font_color = rgb(ffffff)
    placeholder_text = Passwort eingeben...
    position = 0, -20
    halign = center
    valign = center
}

# Fingerabdruck-Hinweis
label {
    monitor =
    text = $FPRINTPROMPT
    color = rgb(89b4fa)
    font_size = 16
    position = 0, -130
    halign = center
    valign = center
}
