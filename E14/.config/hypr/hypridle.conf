general {
    lock_cmd = pidof hyprlock || hyprlock --grace 0
    # Ab tatsächlicher Sperre zählen; Entsperren verwirft den ausstehenden Timer.
    on_lock_cmd = systemd-run --user --unit=hyprlock-dpms --collect --setenv=HYPRLAND_INSTANCE_SIGNATURE --on-active=10s --timer-property=AccuracySec=100ms hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on_unlock_cmd = systemctl --user stop 'hyprlock-dpms.*'; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
    before_sleep_cmd = loginctl lock-session
    # Suspend erst freigeben, wenn die Wayland-Sperre bestätigt ist.
    inhibit_sleep = 3
}

# Nach 5 Minuten auf Akku sperren; bei Netzbetrieb bis zum Abziehen weiter prüfen.
listener {
    timeout = 300
    condition_cmd = ! systemd-ac-power
    condition_retry = 5
    on-timeout = loginctl lock-session
}

# Spätestens nach 15 Minuten unabhängig von der Stromquelle sperren.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}
